name: QA pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright-and-postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Playwright API + UI tests
        run: npm test

      - name: Postman collection via Newman
        if: always()
        run: npm run postman

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            reports/postman/
          retention-days: 14

  jmeter-smoke-load:
    runs-on: ubuntu-latest
    needs: playwright-and-postman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH
      - name: Run a very light load test
        run: ./jmeter/run-load-test.sh 2 4 1
      - uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: jmeter/results/report/
